server {
    listen 8080;

    location /authenticated {
        if ($http_authorization !~ "^Bearer [A-Za-z0-9_-]+[.][A-Za-z0-9_-]+[.][A-Za-z0-9_-]+$") {
            return 401;
        }
        return 200 '{"status":"ok","backend":"mock","authenticated":true}';
        add_header Content-Type application/json;
    }

    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
