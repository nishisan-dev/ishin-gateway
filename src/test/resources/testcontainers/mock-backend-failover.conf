log_format token_requests 'login';

server {
    listen 8080;

    location = /token {
        access_log /tmp/token-requests.log token_requests;
        proxy_pass http://keycloak:8080/realms/inventory-dev/protocol/openid-connect/token;
    }

    location /authenticated {
        if ($http_authorization !~ "^Bearer [A-Za-z0-9_-]+[.][A-Za-z0-9_-]+[.][A-Za-z0-9_-]+$") {
            return 401;
        }
        return 200 '{"authenticated":true,"authorization":"$http_authorization"}';
        add_header Content-Type application/json;
    }

    location /health {
        return 200 'ok';
    }
}
