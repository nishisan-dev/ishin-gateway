---
mode: proxy

endpoints:
  default:
    listeners:
      http-noauth:
        listenAddress: "0.0.0.0"
        listenPort: 9091
        virtualPort: 9091
        ssl: false
        scriptOnly: false
        defaultScript: "Default.groovy"
        defaultBackend: "static-backend"
        secured: false
        urlContexts:
          default:
            context: "/*"
            method: "ANY"
            ruleMapping: "default/Rules.groovy"

    backends:
      static-backend:
        backendName: "static-backend"
        members:
          - url: "http://static-backend:8080"

    ruleMapping: "default/Rules.groovy"
    ruleMappingThreads: 1
    socketTimeout: 30

    # Jetty Thread Pool
    jettyMinThreads: 16
    jettyMaxThreads: 500
    jettyIdleTimeout: 120000

    # OkHttp Connection Pool
    connectionPoolSize: 256
    connectionPoolKeepAliveMinutes: 5

    # OkHttp Dispatcher
    dispatcherMaxRequests: 512
    dispatcherMaxRequestsPerHost: 256

# --- Cluster Mode (NGrid) ---
# nodeId is resolved by env ISHIN_CLUSTER_NODE_ID; the advertised host can be
# overridden by ISHIN_CLUSTER_HOST for Docker service-name routing.
cluster:
  enabled: true
  host: "0.0.0.0"
  port: 7100
  clusterName: "ishin-cluster"
  seeds:
    - "ishin-tunnel:7100"
    - "ishin-node1:7100"
    - "ishin-node2:7100"
    - "ishin-node3:7100"
  replicationFactor: 2
  dataDirectory: "/tmp/ngrid-data"

# --- Observability Dashboard ---
dashboard:
  enabled: true
  port: 9200
  bindAddress: "0.0.0.0"
  allowedIps: []
  storage:
    path: "/tmp/ishin-dashboard"
    retentionHours: 24
    scrapeIntervalSeconds: 15
  zipkin:
    enabled: true
    baseUrl: "http://zipkin:9411"

# --- Tunnel Registration ---
# Each proxy publishes realPort 9091 as virtualPort 9091. The tunnel container
# opens the virtual port and balances TCP connections across these proxy nodes.
tunnel:
  registration:
    enabled: true
    keepaliveInterval: 3
    status: "ACTIVE"
    weight: 100
